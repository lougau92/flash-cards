<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/flash-cards/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare text summaries across providers and models.">
  <meta name="theme-color" content="#0175C2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Summary Lab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>LLM Summary Lab</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const testPwa = new URLSearchParams(location.search).has('pwa-test');
    if ('serviceWorker' in navigator && (!local || testPwa)) {
      const updating = Boolean(navigator.serviceWorker.controller);
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating && !reloading) {
          reloading = true;
          location.reload();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service_worker.js', {updateViaCache: 'none'})
          .catch(error => console.error('Offline setup failed:', error));
      });
    }
  </script>
</body>
</html>
